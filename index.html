<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AURA · Pulse — Customer Success</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --navy:#1b2a4e; --navy-2:#24365f; --cyan:#22c0e8; --cyan-600:#12a4cf; --cyan-bg:#e3f7fd;
  --violet:#8b7cf6; --violet-bg:#efeafe; --green:#2fbf74; --green-bg:#e3f7ec;
  --amber:#f5952b; --amber-bg:#fdeeda; --red:#e94a3b; --red-bg:#fde7e3; --yellow:#f4c33d;
  --bg:#f3f4f8; --card:#fff; --line:#e9ebf2; --text:#25304a; --muted:#7c879c; --muted-2:#9aa3b6;
  --radius:18px; --radius-sm:12px;
  --shadow:0 1px 2px rgba(20,30,60,.05),0 10px 30px rgba(20,30,60,.06);
  --shadow-sm:0 1px 2px rgba(20,30,60,.05),0 4px 14px rgba(20,30,60,.05);
  --font:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --font-body:'Inter',-apple-system,'Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit}
h1,h2,h3,h4{font-family:var(--font);font-weight:700;color:var(--navy);line-height:1.2}
::selection{background:var(--cyan-bg)}
.hide{display:none!important}
.logo{width:34px;height:34px;flex:none}.logo svg{display:block;width:100%;height:100%}

/* login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(1200px 600px at 15% -10%,#e8f9ff 0,transparent 55%),radial-gradient(900px 500px at 110% 120%,#eef0fb 0,transparent 50%),var(--bg)}
.login-card{width:100%;max-width:410px;background:#fff;border-radius:24px;box-shadow:var(--shadow);padding:40px 38px 30px;border:1px solid var(--line)}
.login-brand{display:flex;align-items:center;gap:11px;margin-bottom:32px}
.login-brand .name{font-family:var(--font);font-weight:700;font-size:21px;letter-spacing:.16em;color:var(--navy)}
.login-card h1{font-size:22px;margin-bottom:5px}.login-card .sub{color:var(--muted);font-size:13.5px;margin-bottom:26px}
.field{margin-bottom:15px}.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:7px}
.field input{width:100%;padding:13px 15px;border:1.5px solid var(--line);border-radius:12px;font-size:14px;background:#fbfcfe;color:var(--text)}
.field input:focus{outline:none;border-color:var(--cyan);background:#fff;box-shadow:0 0 0 4px var(--cyan-bg)}
.btn-primary{width:100%;background:var(--navy);color:#fff;font-family:var(--font);font-weight:600;font-size:14px;padding:14px;border-radius:12px;margin-top:4px;transition:.15s}
.btn-primary:hover{background:#142138}
.divider{display:flex;align-items:center;gap:14px;color:var(--muted-2);font-size:12px;margin:18px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.sso{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:var(--navy);border:1.5px solid var(--line);font-family:var(--font);font-weight:600;font-size:14px;padding:13px;border-radius:12px}
.sso:hover{border-color:var(--cyan)}
.login-hint{margin-top:16px;background:var(--cyan-bg);color:var(--cyan-600);font-size:11.5px;padding:9px 12px;border-radius:10px;text-align:center;font-weight:600}
.login-foot{margin-top:20px;text-align:center;color:var(--muted-2);font-size:11px;line-height:1.6}

/* shell */
.app{min-height:100vh;display:grid;grid-template-columns:72px 1fr}
.rail{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:20px 0;gap:6px}
.rail .logo{margin-bottom:18px}
.rail-btn{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:.15s;position:relative}
.rail-btn svg{width:21px;height:21px}.rail-btn:hover{background:var(--bg);color:var(--navy)}
.rail-btn.active{background:var(--navy);color:#fff}
.rail-btn.active::after{content:"";position:absolute;right:-20px;width:4px;height:22px;border-radius:4px;background:var(--cyan)}
.rail-sep{width:26px;height:1px;background:var(--line);margin:6px 0}.rail-spacer{flex:1}
.main{min-height:100vh;display:flex;flex-direction:column;min-width:0;overflow-x:hidden}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;padding:24px 34px 0;gap:16px}
.topbar .crumb{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12.5px;font-weight:600;margin-bottom:8px;cursor:pointer}
.topbar .crumb:hover{color:var(--cyan-600)}
.topbar h1{font-size:25px}.topbar .sub{color:var(--muted);font-size:13.5px;margin-top:5px}
.topbar-right{display:flex;align-items:center;gap:11px}
.scope{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;font-size:12.5px;font-weight:600;color:var(--navy)}
.scope svg{width:15px;height:15px;color:var(--muted)}
.scope select{border:none;background:none;font-weight:600;font-size:12.5px;color:var(--navy);cursor:pointer}
.icon-btn{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--navy);background:#fff;border:1px solid var(--line);position:relative}
.icon-btn svg{width:18px;height:18px}.icon-btn:hover{border-color:var(--cyan);color:var(--cyan-600)}
.badge-dot{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;background:var(--amber);color:#fff;font-size:10px;font-weight:700;border-radius:9px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;font-family:var(--font);font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center}
.content{padding:24px 34px 48px;max-width:1280px;width:100%}

/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:22px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:17px 19px;box-shadow:var(--shadow-sm);cursor:pointer;transition:.15s;text-align:left}
.kpi:hover{border-color:var(--cyan);transform:translateY(-1px)}
.kpi.on{border-color:var(--cyan);box-shadow:0 0 0 3px var(--cyan-bg)}
.kpi .k-label{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:10px}
.kpi .k-ic{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none}.kpi .k-ic svg{width:14px;height:14px}
.kpi .k-val{font-family:var(--font);font-weight:800;font-size:26px;color:var(--navy);letter-spacing:-.01em;line-height:1}
.kpi .k-val small{font-size:14px;font-weight:700;color:var(--muted-2)}
.kpi .k-meta{margin-top:8px;font-size:11.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.k-meta .up{color:var(--green)}.k-meta .down{color:var(--red)}

/* queue */
.queue{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);margin-bottom:22px;overflow:hidden}
.queue-head{display:flex;align-items:center;justify-content:space-between;padding:15px 22px;border-bottom:1px solid var(--line);gap:14px;flex-wrap:wrap}
.queue-head h2{font-size:16px;display:flex;align-items:center;gap:10px}
.q-count{min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--red);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:var(--font)}
.q-count.zero{background:var(--green)}
.sim-chip{font-size:11.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:7px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:lp 2s infinite}
@keyframes lp{0%{box-shadow:0 0 0 0 rgba(47,191,116,.45)}70%{box-shadow:0 0 0 6px rgba(47,191,116,0)}100%{box-shadow:0 0 0 0 rgba(47,191,116,0)}}
.q-sec{padding:9px 22px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted-2);background:#fbfcfe;border-bottom:1px solid var(--line)}
.task{display:grid;grid-template-columns:118px 1fr auto auto;align-items:center;gap:14px;padding:13px 22px;border-bottom:1px solid var(--line);transition:.12s}
.task:last-child{border-bottom:none}.task:hover{background:#fbfcff}
.task-badge{font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:5px 10px;border-radius:8px;text-align:center;white-space:nowrap}
.tb-escalated{background:#3f0d07;color:#ffd9d3}.tb-followup{background:var(--violet-bg);color:var(--violet)}
.tb-alert{background:var(--red-bg);color:var(--red)}.tb-overdue{background:#7a1a10;color:#ffd9d3}
.task-main{cursor:pointer}.task-main .tm-name{font-family:var(--font);font-weight:600;font-size:14px;color:var(--navy)}
.task-main .tm-sub{font-size:12px;color:var(--muted);margin-top:2px}
.task-due{font-size:12px;font-weight:700;text-align:right;white-space:nowrap}.due-now{color:var(--red)}.due-soon{color:var(--amber)}
.task-actions{display:flex;gap:5px}
.tact{width:30px;height:30px;border-radius:9px;background:var(--bg);color:var(--muted);display:flex;align-items:center;justify-content:center;transition:.12s}
.tact svg{width:14px;height:14px}.tact:hover{background:var(--navy);color:#fff}
.tact-ok{background:var(--green-bg);color:#1e7d4c}.tact-ok:hover{background:var(--green);color:#fff}
.tact-esc{background:var(--red-bg);color:var(--red)}.tact-esc:hover{background:var(--red);color:#fff}
.queue-empty{padding:28px 22px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:7px}
.queue-empty svg{width:30px;height:30px;color:var(--green)}.queue-empty .qe-t{font-family:var(--font);font-weight:700;color:var(--navy);font-size:14px}
.q-foot{padding:11px 22px;background:#fbfcfe;font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.q-foot svg{width:14px;height:14px;color:var(--muted-2)}

/* toolbar / views */
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px;flex-wrap:wrap}
.toolbar h2{font-size:16px}
.views{display:flex;gap:6px;flex-wrap:wrap}
.view-chip{padding:7px 13px;border-radius:10px;font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line);background:#fff;display:flex;align-items:center;gap:7px;transition:.15s}
.view-chip:hover{color:var(--navy);border-color:var(--muted-2)}
.view-chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.view-chip .vc{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bg);color:var(--muted);font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.view-chip.on .vc{background:rgba(255,255,255,.22);color:#fff}
.tool-right{display:flex;align-items:center;gap:9px}
.search{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:8px 12px;min-width:210px}
.search svg{width:15px;height:15px;color:var(--muted-2)}
.search input{border:none;outline:none;font-size:13px;width:100%;color:var(--text);background:none}
.sort-sel{border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:9px 11px;font-size:12.5px;font-weight:600;color:var(--navy);cursor:pointer}

/* table */
.tbl{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden}
.tbl-head,.tbl-row{display:grid;align-items:center;gap:13px;padding:13px 20px}
.gridA{grid-template-columns:26px 2fr .85fr 2.2fr 1.35fr 1.15fr}
.gridTeam{grid-template-columns:26px 1.8fr .8fr 2fr 1.2fr .9fr 1.05fr}
.tbl-head{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted-2);border-bottom:1px solid var(--line)}
.tbl-row{border-bottom:1px solid var(--line);cursor:pointer;transition:.12s}
.tbl-row:last-child{border-bottom:none}.tbl-row:hover{background:#fbfcff}
.tbl-row.sel{background:var(--cyan-bg)}
.cbx{width:17px;height:17px;border-radius:5px;border:1.6px solid var(--muted-2);display:flex;align-items:center;justify-content:center;color:transparent}
.cbx.on{background:var(--cyan-600);border-color:var(--cyan-600);color:#fff}.cbx svg{width:12px;height:12px}
.acct-name{font-family:var(--font);font-weight:600;font-size:14px;color:var(--navy)}
.acct-sub{font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.prod-chip{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px}
.prod-refill{background:var(--cyan-bg);color:var(--cyan-600)}.prod-bold{background:var(--violet-bg);color:var(--violet)}
.pulse-badge{display:inline-flex;align-items:center;gap:9px}
.ring{position:relative;flex:none}.ring .rv{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font);font-weight:700}
.tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:7px}
.tag-protect{background:var(--red-bg);color:var(--red)}.tag-grow{background:var(--cyan-bg);color:var(--cyan-600)}
.tag-service{background:var(--amber-bg);color:var(--amber)}.tag-healthy{background:var(--green-bg);color:var(--green)}
.tag-escalated{background:#3f0d07;color:#ffd9d3}.tag-monitored{background:#eef0f6;color:var(--muted)}
.signal-line{font-size:12.5px;font-weight:600;color:var(--text)}.signal-sub{font-size:11px;color:var(--muted);margin-top:2px}
.arr-val{font-family:var(--font);font-weight:700;font-size:14px;color:var(--navy)}
.arr-lbl{font-size:10.5px;font-weight:600;margin-top:2px}
.arr-risk{color:var(--red)}.arr-up{color:var(--cyan-600)}.arr-none{color:var(--muted-2)}
.reninfo{font-size:12px;font-weight:600;color:var(--text)}.reninfo small{display:block;font-size:10.5px;color:var(--muted);font-weight:500;margin-top:1px}
.owner-chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--text)}
.owner-av{width:22px;height:22px;border-radius:50%;background:var(--violet-bg);color:var(--violet);font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:var(--font)}
.play-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:10px;font-size:12px;font-weight:600;color:#fff;white-space:nowrap;transition:.15s}
.play-btn svg{width:13px;height:13px}
.play-protect{background:var(--red)}.play-protect:hover{background:#d33c2e}
.play-grow{background:var(--cyan-600)}.play-grow:hover{background:#0f93ba}
.play-service{background:var(--amber)}.play-service:hover{background:#e0851f}
.play-escalated{background:#3f0d07}.play-escalated:hover{background:#5a140b}
.play-done{background:var(--green-bg);color:var(--green);display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;font-size:12px;font-weight:700}
.play-done svg{width:13px;height:13px}.play-none{color:var(--muted-2);font-size:12px;font-weight:600}

/* bulk bar */
.bulkbar{display:flex;align-items:center;justify-content:space-between;background:var(--navy);color:#fff;border-radius:14px;padding:11px 18px;margin-bottom:12px}
.bulkbar .bb-l{font-size:13px;font-weight:600;display:flex;align-items:center;gap:10px}
.bulkbar .bb-r{display:flex;gap:8px}
.bb-btn{background:rgba(255,255,255,.14);color:#fff;font-weight:600;font-size:12.5px;padding:8px 13px;border-radius:9px;display:flex;align-items:center;gap:7px}
.bb-btn:hover{background:rgba(255,255,255,.24)}.bb-btn svg{width:14px;height:14px}

/* account */
.acct-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:16px}
.acct-head h1{font-size:24px}
.h-meta{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:12px;font-weight:600;margin-top:9px;flex-wrap:wrap}
.h-meta span{display:flex;align-items:center;gap:6px}.h-meta svg{width:14px;height:14px;color:var(--muted-2)}
.acct-stats{display:flex;gap:10px}
.stat-pill{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 16px;box-shadow:var(--shadow-sm);text-align:center;min-width:92px}
.stat-pill .sv{font-family:var(--font);font-weight:800;font-size:18px;color:var(--navy)}
.stat-pill .sl{font-size:10.5px;color:var(--muted);font-weight:600;margin-top:2px}
.arr-split{display:flex;flex-direction:column;gap:3px;text-align:left}
.arr-split .as-row{display:flex;justify-content:space-between;gap:14px;font-size:11px}
.arr-split .as-row b{font-family:var(--font);font-weight:700;color:var(--navy)}
.arr-split .lbl{color:var(--muted);font-weight:600}
.arr-sub{font-size:10.5px;color:var(--muted-2);font-weight:600;margin-top:3px}
.model-note{font-size:11.5px;color:var(--muted);line-height:1.5;background:var(--bg);border-radius:9px;padding:9px 12px}.model-note b{color:var(--cyan-600)}
.reassign{border:1px dashed var(--line);border-radius:10px;padding:7px 10px;font-size:11.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:7px;cursor:pointer}
.reassign:hover{border-color:var(--cyan);color:var(--cyan-600)}.reassign svg{width:13px;height:13px}
.logtouch{display:flex;align-items:center;gap:7px;justify-content:center;background:var(--navy);color:#fff;font-family:var(--font);font-weight:600;font-size:12px;padding:9px 12px;border-radius:10px;transition:.15s}
.logtouch:hover{background:#142138}.logtouch svg{width:13px;height:13px}
.whyrank{display:inline-flex;align-items:center;gap:6px;margin-top:7px;font-size:11px;font-weight:600;color:var(--cyan-600);background:var(--cyan-bg);padding:3px 9px;border-radius:8px}
.whyrank svg{width:12px;height:12px}
.renewal-obj{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.ro-head{display:flex;align-items:center;justify-content:space-between}
.ro-won{font-size:11px;font-weight:700;color:var(--green);background:var(--green-bg);padding:3px 9px;border-radius:7px}
.ro-fc{font-size:10px;font-weight:700;padding:3px 9px;border-radius:7px}
.ro-commit{background:var(--green-bg);color:#1e7d4c}.ro-best{background:var(--cyan-bg);color:var(--cyan-600)}.ro-risk{background:var(--red-bg);color:var(--red)}
.ro-actions{display:flex;gap:8px;margin-top:2px}
.ro-btn{display:flex;align-items:center;gap:6px;font-family:var(--font);font-weight:600;font-size:11.5px;padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);color:var(--muted)}
.ro-btn:hover{border-color:var(--muted-2);color:var(--navy)}.ro-btn svg{width:13px;height:13px}
.ro-adv{background:var(--navy);color:#fff;border-color:var(--navy)}.ro-adv:hover{background:#142138;color:#fff}
.teamfc{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-sm);padding:16px 20px;margin-bottom:14px}
.tfc-title{font-family:var(--font);font-weight:700;font-size:13px;color:var(--navy);display:flex;align-items:center;gap:8px;margin-bottom:12px}
.tfc-title svg{width:14px;height:14px;color:var(--muted)}
.tfc-nums{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.tfc{border-left:2px solid var(--line);padding-left:12px}
.tfc .tv{font-family:var(--font);font-weight:800;font-size:20px;color:var(--navy);line-height:1}
.tfc .tl{font-size:11px;color:var(--muted);font-weight:600;margin-top:4px}
.tfc-cov{margin-top:12px;padding-top:11px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);font-weight:600}
.seq-to{font-size:10px;color:var(--cyan-600);font-weight:700;background:var(--cyan-bg);padding:1px 6px;border-radius:6px;margin-left:8px}
/* pulse progressive disclosure */
.driver{font-size:12px;color:var(--muted);margin-top:8px}.driver b{color:var(--navy)}
.sig-w{font-size:9.5px;font-weight:700;color:var(--violet);background:var(--violet-bg);padding:1px 5px;border-radius:5px;margin-left:4px}
.composite{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);font-weight:600;line-height:1.5}
.composite b{font-family:var(--font);font-size:14px;color:var(--navy)}.composite span{color:var(--muted-2)}
.driver-score{font-family:var(--font);font-weight:800;margin-left:2px}
.peek{margin-top:14px;display:inline-flex;align-items:center;gap:6px;font-family:var(--font);font-weight:600;font-size:12px;color:var(--cyan-600);padding:6px 0}
.peek:hover{color:var(--navy)}.peek svg{width:13px;height:13px}
.whatchg{font-size:11.5px;color:var(--muted);margin-top:12px;background:var(--bg);border-radius:9px;padding:9px 12px}.whatchg b{color:var(--navy)}
.ttip{color:var(--muted-2);cursor:help;font-size:10px;vertical-align:super}
.norm-note{font-size:11px;color:var(--muted);font-weight:600;margin-top:8px}
/* labeled queue buttons */
.tbtn{display:inline-flex;align-items:center;gap:5px;font-family:var(--font);font-weight:600;font-size:11px;padding:6px 10px;border-radius:9px;border:1.5px solid var(--line);background:#fff;color:var(--muted);transition:.12s;white-space:nowrap}
.tbtn svg{width:13px;height:13px}
.tb-ok{border-color:#bfe6cf;color:#1e7d4c;background:var(--green-bg)}.tb-ok:hover{background:#d3f2e0}
.tb-esc{border-color:#f6c9c2;color:var(--red)}.tb-esc:hover{background:var(--red-bg)}
.tb-mut:hover{border-color:var(--muted-2);color:var(--navy)}
.strat-chip{font-size:9.5px;font-weight:700;color:var(--violet);background:var(--violet-bg);padding:2px 7px;border-radius:6px;margin-left:8px;vertical-align:middle}
/* welcome / first-run */
.welcome{position:relative;background:linear-gradient(120deg,#eef6ff,#f4fcff);border:1px solid #cfe6f7;border-radius:var(--radius);padding:18px 22px;margin-bottom:20px}
.wl-x{position:absolute;top:14px;right:14px;width:28px;height:28px;border-radius:8px;color:var(--muted);display:flex;align-items:center;justify-content:center}.wl-x:hover{background:#fff;color:var(--navy)}
.wl-t{font-family:var(--font);font-weight:700;font-size:15px;color:var(--navy);display:flex;align-items:center;gap:8px;margin-bottom:14px}.wl-t svg{width:15px;height:15px;color:var(--cyan-600)}
.wl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
.wl-item{display:flex;gap:10px;font-size:12.5px;color:var(--text);line-height:1.45}.wl-item b{color:var(--navy)}
.wl-n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--cyan-600);color:#fff;font-family:var(--font);font-weight:700;font-size:11px;display:flex;align-items:center;justify-content:center}
.wl-go{background:var(--navy);color:#fff;font-family:var(--font);font-weight:600;font-size:12.5px;padding:9px 18px;border-radius:10px}.wl-go:hover{background:#142138}
@media(max-width:1000px){.wl-grid{grid-template-columns:1fr}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{padding:10px 16px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:.15s;display:flex;align-items:center;gap:7px}
.tab:hover{color:var(--navy)}.tab.on{color:var(--navy);border-color:var(--cyan)}
.tab .tcount{font-size:10px;background:var(--bg);color:var(--muted);padding:1px 6px;border-radius:8px;font-weight:700}
.grid-2{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;margin-bottom:16px}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm)}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.panel-head h3{font-size:14.5px}
.panel-head .ph-tag{font-size:11px;font-weight:600;color:var(--muted)}
.big-pulse{display:flex;align-items:center;gap:16px;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:16px}
.big-ring{position:relative;flex:none}.big-ring .bv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.big-ring .bv b{font-family:var(--font);font-weight:800;font-size:26px;color:var(--navy);line-height:1}
.big-ring .bv small{font-size:9px;color:var(--muted);font-weight:600;letter-spacing:.03em}
.bp-txt .t{font-family:var(--font);font-weight:700;font-size:15px;color:var(--navy)}.bp-txt .s{font-size:12px;color:var(--muted);margin-top:3px;max-width:230px}
.delta{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:7px;margin-top:6px}
.delta.dn{background:var(--red-bg);color:var(--red)}.delta.up{background:var(--green-bg);color:var(--green)}
.whatchg{font-size:11.5px;color:var(--muted);margin-top:8px;background:var(--bg);border-radius:9px;padding:8px 11px}
.whatchg b{color:var(--navy)}
.sig-list{display:flex;flex-direction:column;gap:12px}
.sig{display:grid;grid-template-columns:145px 1fr 34px;align-items:center;gap:12px}
.sig-name{font-size:12px;font-weight:600;color:var(--text)}.sig-name small{display:block;font-size:10px;color:var(--muted);font-weight:500}
.bar{height:8px;background:var(--bg);border-radius:6px;overflow:hidden}.bar>i{display:block;height:100%;border-radius:6px}
.sig-score{font-family:var(--font);font-weight:700;font-size:12.5px;text-align:right}
.usage-metrics{display:flex;gap:22px;margin-bottom:14px}
.um .uv{font-family:var(--font);font-weight:800;font-size:20px;color:var(--navy)}.um .uv.down{color:var(--red)}.um .uv.up{color:var(--green)}
.um .ul{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
.spark{width:100%;height:56px;margin-bottom:4px}
.norm-note{font-size:11.5px;color:var(--muted);background:var(--amber-bg);border-radius:9px;padding:8px 11px;margin-top:8px}
.norm-note b{color:#a5641a}
/* contract */
.kv{display:flex;flex-direction:column;gap:9px}
.kv-row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px}
.kv-row .k{color:var(--muted);font-weight:600}.kv-row .v{color:var(--navy);font-weight:600}
.kv-row .v.warn{color:var(--amber)}.kv-row .v.risk{color:var(--red)}
.arrbar{height:12px;border-radius:7px;overflow:hidden;display:flex;margin:6px 0 4px}
.arrbar i{display:block;height:100%}
.arrbar .cm{background:var(--navy)}.arrbar .cs{background:var(--cyan)}
.arrleg{display:flex;gap:16px;font-size:11px;color:var(--muted);font-weight:600}
.arrleg .dot{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}
/* recommended play / sequence */
.rec{border-radius:16px;padding:19px}
.rec.rec-protect{border:1.5px solid #f6c9c2;background:linear-gradient(180deg,#fff6f4,#fff)}
.rec.rec-grow{border:1.5px solid #bfe9f5;background:linear-gradient(180deg,#f4fcff,#fff)}
.rec-tag{display:inline-flex;align-items:center;gap:7px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:8px;margin-bottom:11px}
.rec-protect .rec-tag{background:var(--red-bg);color:var(--red)}.rec-grow .rec-tag{background:var(--cyan-bg);color:var(--cyan-600)}
.rec h3{font-size:15.5px;margin-bottom:9px}.rec .rec-body{font-size:12.5px;color:var(--text);line-height:1.6}.rec .rec-body b{color:var(--navy);font-weight:700}
.seq{margin:14px 0;display:flex;flex-direction:column;gap:0}
.seq-step{display:flex;align-items:center;gap:11px;padding:7px 0}
.seq-dot{width:22px;height:22px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;font-family:var(--font);border:1.6px solid var(--line);color:var(--muted);background:#fff}
.seq-dot.cur{background:var(--red);border-color:var(--red);color:#fff}
.seq-dot.done{background:var(--green);border-color:var(--green);color:#fff}
.rec-grow .seq-dot.cur{background:var(--cyan-600);border-color:var(--cyan-600)}
.seq-step .st{font-size:12px;font-weight:600;color:var(--text)}.seq-step.donestep .st{color:var(--muted-2);text-decoration:line-through}
.seq-step .stc{font-size:10.5px;color:var(--muted);margin-left:auto;font-weight:600}
.rec-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.rec-amt{font-family:var(--font);font-weight:800;font-size:19px}.rec-amt.risk{color:var(--red)}.rec-amt.up{color:var(--cyan-600)}
.rec-amt small{display:block;font-size:10.5px;color:var(--muted);font-weight:600}
.rec-actions{display:flex;gap:8px}
.rec-start{display:inline-flex;align-items:center;gap:7px;color:#fff;font-family:var(--font);font-weight:600;font-size:13px;padding:11px 17px;border-radius:11px;transition:.15s}
.rec-protect .rec-start{background:var(--red)}.rec-protect .rec-start:hover{background:#d33c2e}
.rec-grow .rec-start{background:var(--cyan-600)}.rec-grow .rec-start:hover{background:#0f93ba}
.rec-start svg{width:15px;height:15px}
.rec-sec{display:inline-flex;align-items:center;gap:6px;font-family:var(--font);font-weight:600;font-size:12.5px;padding:11px 13px;border-radius:11px;border:1.5px solid var(--line);color:var(--muted)}
.rec-sec:hover{border-color:var(--muted-2);color:var(--navy)}.rec-sec svg{width:14px;height:14px}
/* monitor / followup / dismissed */
.monitor-note{display:flex;gap:13px;align-items:flex-start;background:var(--cyan-bg);border-radius:14px;padding:15px 17px}
.monitor-note .mn-ic{width:38px;height:38px;border-radius:11px;background:#fff;color:var(--cyan-600);display:flex;align-items:center;justify-content:center;flex:none}.monitor-note .mn-ic svg{width:18px;height:18px}
.monitor-note .mn-t{font-family:var(--font);font-weight:700;font-size:13px;color:var(--navy)}.monitor-note .mn-s{font-size:12px;color:var(--text);margin-top:4px;line-height:1.5}.monitor-note .mn-s b{color:var(--cyan-600)}
.fu-read{display:flex;align-items:center;gap:10px;padding:12px 15px;border-radius:12px;font-size:12.5px;font-weight:600;margin-bottom:15px;line-height:1.4}
.fu-read svg{flex:none}.fu-read.ok{background:var(--green-bg);color:#1e7d4c}.fu-read.ok svg{color:var(--green)}
.fu-read.bad{background:var(--red-bg);color:#b93526}.fu-read.bad svg{color:var(--red)}
.fu-q{font-family:var(--font);font-weight:700;font-size:13.5px;color:var(--navy);margin-bottom:12px}
.fu-actions{display:flex;flex-direction:column;gap:9px}
.fu-btn{display:flex;align-items:center;gap:9px;padding:11px 14px;border-radius:12px;font-family:var(--font);font-weight:600;font-size:12.5px;border:1.5px solid var(--line);background:#fff;color:var(--text)}
.fu-btn svg{width:15px;height:15px}
.fu-btn.resolved{border-color:#bfe6cf;color:#1e7d4c;background:var(--green-bg)}.fu-btn.resolved:hover{background:#d3f2e0}
.fu-btn.escalate{border-color:#f6c9c2;color:var(--red)}.fu-btn.escalate:hover{background:var(--red-bg)}
.fu-btn.snooze{color:var(--muted)}.fu-btn.snooze:hover{border-color:var(--muted-2);color:var(--navy)}
.dismissed-note{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:14px;padding:15px 17px}
.dismissed-note svg{width:20px;height:20px;color:var(--muted)}
.dismissed-note .dn-t{font-family:var(--font);font-weight:700;font-size:13px;color:var(--navy)}
.dismissed-note .dn-s{font-size:12px;color:var(--muted);margin-top:2px}
.dismissed-note .dn-undo{margin-left:auto;font-weight:600;color:var(--cyan-600);font-size:12.5px}
/* esc banner */
.esc-banner{background:linear-gradient(90deg,#3f0d07,#7a1a10);border-radius:15px;padding:15px 20px;margin-bottom:16px;display:flex;align-items:center;gap:14px;color:#fff}
.esc-banner .eb-ic{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;flex:none}.esc-banner .eb-ic svg{width:20px;height:20px;color:#fff}
.esc-banner .eb-t{font-family:var(--font);font-weight:700;font-size:14px}.esc-banner .eb-s{font-size:12px;color:#ffd0c8;margin-top:2px}
/* stakeholders */
.stk-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stk{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow-sm)}
.stk-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.stk-av{width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;font-family:var(--font);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none}
.stk-av.vacant{background:var(--red-bg);color:var(--red)}
.stk-nm{font-family:var(--font);font-weight:600;font-size:14px;color:var(--navy)}.stk-role{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:1px}
.stk-meta{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:4px}
.senti{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:11px;padding:3px 8px;border-radius:7px}
.senti.pos{background:var(--green-bg);color:var(--green)}.senti.neu{background:var(--amber-bg);color:var(--amber)}.senti.neg{background:var(--red-bg);color:var(--red)}.senti.gone{background:var(--red-bg);color:var(--red)}
.role-tag{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:2px 7px;border-radius:6px;background:var(--violet-bg);color:var(--violet)}
/* locations */
.loc-list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.loc-row{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border:1px solid var(--line);border-radius:11px;font-size:12.5px}
.loc-row .ln{font-weight:600;color:var(--navy)}.loc-row .lm{color:var(--muted);font-size:11.5px}
/* insights */
.flavors{display:flex;flex-direction:column;gap:9px}
.flav{display:flex;align-items:center;gap:10px}.flav .fn{font-size:12px;font-weight:600;color:var(--text);min-width:100px}
.flav .fbar{flex:1;height:7px;background:var(--bg);border-radius:6px;overflow:hidden}.flav .fbar>i{display:block;height:100%;border-radius:6px}
.flav .fp{font-size:11.5px;font-weight:600;color:var(--muted);min-width:32px;text-align:right}
.esg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:6px}
.esg-c{background:var(--green-bg);border-radius:13px;padding:14px;text-align:center}
.esg-c .ev{font-family:var(--font);font-weight:800;font-size:22px;color:#1e7d4c}.esg-c .el{font-size:11px;color:#2a8a58;font-weight:600;margin-top:2px}
/* timeline */
.timeline{display:flex;flex-direction:column;gap:2px}
.tl{display:flex;gap:12px;padding:10px 0}
.tl-ic{width:30px;height:30px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center}.tl-ic svg{width:15px;height:15px}
.tl-body .t{font-size:12.5px;font-weight:600;color:var(--text)}.tl-body .m{font-size:11px;color:var(--muted-2);margin-top:2px}
/* opportunity */
.opp-card{border:1.5px solid #bfe9f5;background:linear-gradient(180deg,#f4fcff,#fff);border-radius:16px;padding:18px;margin-top:16px}
.opp-stages{display:flex;gap:6px;margin:12px 0}
.opp-stage{flex:1;text-align:center;font-size:10.5px;font-weight:700;color:var(--muted-2);padding:7px 4px;border-radius:8px;background:var(--bg)}
.opp-stage.on{background:var(--cyan-600);color:#fff}.opp-stage.past{background:var(--cyan-bg);color:var(--cyan-600)}

/* drawer + overlay */
.overlay{position:fixed;inset:0;background:rgba(20,28,50,.44);backdrop-filter:blur(2px);z-index:60;opacity:0;pointer-events:none;transition:.2s}
.overlay.active{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,95vw);background:#fff;z-index:70;box-shadow:-16px 0 48px rgba(20,30,60,.18);transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.drawer.active{transform:translateX(0)}
.dr-head{padding:22px 26px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.dr-head .dtag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:8px;margin-bottom:9px;display:inline-block}
.dr-head h2{font-size:17px;color:var(--navy)}
.dr-close{width:34px;height:34px;border-radius:10px;background:var(--bg);color:var(--muted);display:flex;align-items:center;justify-content:center;flex:none}.dr-close:hover{background:#e9ebf2;color:var(--navy)}
.dr-body{padding:20px 26px;overflow-y:auto;flex:1}
.dr-ctx{background:var(--bg);border-radius:13px;padding:14px 16px;margin-bottom:18px}
.dr-ctx .dc-row{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0}.dr-ctx .dc-row .l{color:var(--muted);font-weight:600}.dr-ctx .dc-row .v{color:var(--navy);font-weight:600}
.dr-lbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.dr-field{margin-bottom:18px}
.chan-row{display:flex;gap:8px}
.chan{flex:1;padding:10px;border:1.5px solid var(--line);border-radius:11px;font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:7px}
.chan svg{width:15px;height:15px}.chan.active{border-color:var(--cyan);color:var(--cyan-600);background:var(--cyan-bg)}
textarea.dr-msg{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px;font-family:var(--font-body);font-size:13px;line-height:1.6;color:var(--text);background:#fbfcfe;resize:vertical;min-height:170px}
textarea.dr-msg:focus{outline:none;border-color:var(--cyan);background:#fff;box-shadow:0 0 0 4px var(--cyan-bg)}
.dr-input{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:11px 13px;font-family:var(--font-body);font-size:13px;color:var(--text);background:#fbfcfe}
.dr-input:focus{outline:none;border-color:var(--cyan);background:#fff}
.dr-two{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.writeback{display:flex;align-items:center;gap:10px;background:var(--cyan-bg);border-radius:11px;padding:10px 13px;font-size:11.5px;color:var(--cyan-600);font-weight:600;margin-top:4px}
.writeback svg{width:15px;height:15px;flex:none}
.dr-foot{padding:16px 26px;border-top:1px solid var(--line);display:flex;gap:11px}
.dr-cancel{padding:12px 18px;border:1.5px solid var(--line);border-radius:12px;font-family:var(--font);font-weight:600;font-size:13px;color:var(--muted)}.dr-cancel:hover{border-color:var(--muted-2);color:var(--navy)}
.dr-submit{flex:1;color:#fff;font-family:var(--font);font-weight:600;font-size:13px;padding:12px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px}
.dr-submit svg{width:16px;height:16px}
.s-protect{background:var(--red)}.s-protect:hover{background:#d33c2e}.s-grow{background:var(--cyan-600)}.s-grow:hover{background:#0f93ba}.s-service{background:var(--amber)}
/* reason options */
.reasons{display:flex;flex-direction:column;gap:9px}
.reason{display:flex;align-items:center;gap:11px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:13px;font-weight:600;color:var(--text);text-align:left}
.reason:hover{border-color:var(--cyan);background:var(--cyan-bg);color:var(--navy)}
.reason svg{width:16px;height:16px;color:var(--muted-2)}
/* toast */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(24px);background:var(--navy);color:#fff;padding:14px 20px;border-radius:14px;box-shadow:0 12px 40px rgba(20,30,60,.32);display:flex;align-items:center;gap:13px;z-index:90;opacity:0;pointer-events:none;transition:.3s;max-width:92vw}
.toast.active{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---- Pulse score = weighted composite of 5 normalised signals (usage is heaviest: usage = revenue) ---- */
const WEIGHTS={usage:0.35,adoption:0.20,sentiment:0.20,service:0.15,consumable:0.10};
const WLABEL={usage:'Usage',adoption:'Adoption',sentiment:'Sentiment',service:'Service',consumable:'Consumables'};
function computePulse(sig){return Math.round(Object.keys(WEIGHTS).reduce((s,k)=>s+WEIGHTS[k]*sig[k],0));}
function clampN(v){return Math.max(4,Math.min(99,Math.round(v)));}
// initialise every account: derive sentiment from the stakeholder map, compute the score, and
// re-anchor the 8-week history + delta so the number, the bars and the sparkline all agree.
ACCOUNTS.forEach(a=>{
  a.signals.sentiment=deriveSentiment(a).score;
  a.pulse=computePulse(a.signals);
  const last=a.pulseHist[a.pulseHist.length-1], shift=a.pulse-last;
  a.pulseHist=a.pulseHist.map(v=>clampN(v+shift));
  a.delta=a.pulseHist[a.pulseHist.length-1]-a.pulseHist[0];
  a.monthly=Math.round(a.drinksMonth*a.rate);
  a.runrate=a.monthly*12;
  a.arr=(a.cls==='grow')?(a.upside||0):a.runrate;
});

function ringSVG(score,size){const r=size/2-4,c=2*Math.PI*r,off=c*(1-score/100);const col=score>=70?CLR.healthy:score>=55?CLR.service:CLR.protect;
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#eef0f6" stroke-width="4"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})"/></svg>`;}
function sparkFromHist(hist,col){const w=340,h=48,max=Math.max(...hist)+4,min=Math.min(...hist)-4,rng=(max-min)||1;
  const pts=hist.map((v,i)=>`${(i/(hist.length-1))*w},${h-((v-min)/rng)*h}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;}
function usageSpark(trend){const up=[30,34,28,40,36,48,44,58,54,62],down=[58,54,60,48,50,40,42,34,30,24],flat=[42,44,40,45,42,44,41,43,42,44];
  const d=trend==='up'?up:trend==='down'?down:flat,col=trend==='up'?CLR.healthy:trend==='down'?CLR.protect:CLR.service,w=340,h=56,max=64;
  const pts=d.map((v,i)=>`${(i/(d.length-1))*w},${h-(v/max)*h}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="sg${trend}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><polygon points="0,${h} ${pts} ${w},${h}" fill="url(#sg${trend})"/><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;}
function initials(n){return n.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();}

// urgency runs off the notice deadline where one exists — that's the date that kills the renewal
function effectiveDays(a){return (a.renewal&&a.renewal.noticeDays!=null)?a.renewal.noticeDays:(a.renewal?a.renewal.days:999);}
function deadlineLabel(a){if(a.renewal&&a.renewal.noticeDays!=null)return 'Notice '+a.renewal.noticeDays+'d';return a.renewal&&a.renewal.days<900?'Renews '+a.renewal.days+'d':'—';}
// sentiment is derived from the stakeholder map, not a phantom CSAT
function deriveSentiment(a){
  let sc=65; const reasons=[];
  const champ=a.contacts.find(c=>c.role==='Champion'||c.role==='Owner');
  if(champ){ if(champ.vacant||champ.sentiment==='gone'){sc-=24;reasons.push('champion left');}
    else if(champ.sentiment==='pos'){sc+=20;reasons.push('positive champion');}
    else if(champ.sentiment==='neg'){sc-=18;reasons.push('champion at risk');}
    else reasons.push('champion neutral'); }
  else { sc-=10; reasons.push('no champion mapped'); }
  const det=a.contacts.filter(c=>c.role!=='Champion'&&c.role!=='Owner'&&c.sentiment==='neg').length;
  if(det){sc-=12*det;reasons.push(det+' detractor'+(det>1?'s':''));}
  const buyer=a.contacts.find(c=>c.role==='Economic buyer');
  if(buyer&&buyer.sentiment==='pos'){sc+=6;reasons.push('buyer engaged');}
  sc=Math.max(12,Math.min(94,sc));
  return {score:sc,why:reasons.slice(0,2).join(' · ')};
}

    const pulseCell=`<div class="pulse-badge"><div class="ring" style="width:36px;height:36px">${ringSVG(a.pulse,36)}<span class="rv" style="font-size:12px">${a.pulse}</span></div><span class="tag tag-${tagCls}">${tagTxt}</span></div>`;
    const cbx=`<div class="cbx ${sel?'on':''}" onclick="event.stopPropagation();toggleSel('${a.id}')">${sel?svg('check',12):''}</div>`;
    if(team){
      return `<div class="tbl-row ${gridCls} ${sel?'sel':''}" onclick="openAccount('${a.id}')">${cbx}${nameCell}${pulseCell}<div class="col-hide"><div class="signal-line">${a.signalText}</div><div class="signal-sub">${a.signalSub}</div></div><div><div class="arr-val">${a.cls==='healthy'?'—':eur(a.arr)}</div><div class="arr-lbl ${arrCls}">${a.cls==='grow'?'upside':(a.cls==='healthy'?'—':'at risk')}</div></div><div><span class="owner-chip"><span class="owner-av">${initials(a.owner)}</span>${a.owner}</span></div><div>${playBtn}</div></div>`;
    }
    return `<div class="tbl-row ${gridCls} ${sel?'sel':''}" onclick="openAccount('${a.id}')">${cbx}${nameCell}${pulseCell}<div class="col-hide"><div class="signal-line">${a.signalText}</div><div class="signal-sub">${a.signalSub}</div></div><div><div class="reninfo">${a.renewal.noticeDays!=null?`<span style="color:${a.renewal.noticeDays<=90?'var(--red)':'inherit'}">notice ${a.renewal.noticeDays}d</span>`:(a.renewal.days<900?'renews '+a.renewal.days+'d':'—')}<small>${a.renewal.type} · ${a.renewal.date}</small></div></div><div>${playBtn}</div></div>`;
  }).join('');
  const empty=list.length===0?`<div class="empty-note">${svg('check',32)}<div class="en-t">Nothing here</div>No accounts match this view.</div>`:'';

  const bulk=STATE.selected.length?`<div class="bulkbar"><div class="bb-l">${STATE.selected.length} selected <span class="kbd">·</span> <button class="bb-btn" onclick="clearSel()">Clear</button></div><div class="bb-r"><button class="bb-btn" onclick="bulkSnooze()">${svg('moon',14)} Snooze</button><button class="bb-btn" onclick="bulkReassign()">${svg('swap',14)} Reassign</button></div></div>`:'';

  const fc=renewForecast();
  const teamStrip=team?`<div class="teamfc"><div class="tfc-title">${svg('users',14)} Team renewal forecast · next 90 days</div>
    <div class="tfc-nums">
      <div class="tfc"><div class="tv" style="color:var(--green)">${eur(fc.commit)}</div><div class="tl">Commit</div></div>
      <div class="tfc"><div class="tv" style="color:var(--cyan-600)">${eur(fc.best)}</div><div class="tl">Best case</div></div>
      <div class="tfc"><div class="tv" style="color:var(--red)">${eur(fc.risk)}</div><div class="tl">At risk · needs a save</div></div>
      <div class="tfc"><div class="tv">${fc.n}</div><div class="tl">Renewals ≤90d</div></div>
    </div>
    <div class="tfc-cov">Coverage · ${eur(riskSum())} ARR at risk · ${eur(pipelineSum()||upsideSum())} expansion · ${visibleAccounts().length} accounts across ${new Set(visibleAccounts().map(a=>a.owner)).size} CSMs</div></div>`:'';

  const toolbar=`<div class="toolbar"><div class="views">${VIEWS.map(([id,l])=>{const n=id==='needs'?actionCount():id==='renew90'?renew90().length:id==='grow'?visibleAccounts().filter(a=>a.cls==='grow').length:id==='protect'?visibleAccounts().filter(a=>a.cls==='protect'||a.cls==='service').length:id==='all'?visibleAccounts().length:'';return `<button class="view-chip ${STATE.viewFilter===id?'on':''}" onclick="setView('${id}')">${l}${n!==''?`<span class="vc">${n}</span>`:''}</button>`;}).join('')}</div>
    <div class="tool-right"><div class="search">${svg('search')}<input placeholder="Search accounts…" value="${STATE.search}" oninput="onSearch(this.value)"/></div>
    <select class="sort-sel" onchange="setSort(this.value)"><option value="risk" ${STATE.sort==='risk'?'selected':''}>Sort: € impact</option><option value="priority" ${STATE.sort==='priority'?'selected':''}>Sort: priority (€ + strategic)</option><option value="renewal" ${STATE.sort==='renewal'?'selected':''}>Sort: renewal deadline</option><option value="pulse" ${STATE.sort==='pulse'?'selected':''}>Sort: lowest pulse</option></select></div></div>`;

  const welcome=(!STATE.tourDone)?`<div class="welcome"><button class="wl-x" onclick="dismissTour()">${svg('x',15)}</button>
    <div class="wl-t">Welcome to Pulse ${svg('pulse',15)}</div>
    <div class="wl-grid">
      <div class="wl-item"><span class="wl-n">1</span><div><b>Needs you today</b> is your ranked to-do — work it top to bottom.</div></div>
      <div class="wl-item"><span class="wl-n">2</span><div>Open any account for telemetry, contract and the recommended play — in one view.</div></div>
      <div class="wl-item"><span class="wl-n">3</span><div><b>Log a touch</b> on an account records any call or note. Press <b>/</b> to search.</div></div>
    </div>
    <button class="wl-go" onclick="dismissTour()">Got it</button></div>`:'';
  document.getElementById('content').innerHTML=welcome+kpis+renderQueue()+`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px"><h2 style="font-size:16px">Your book of business</h2></div>`+teamStrip+toolbar+bulk+`<div class="tbl">${head}${rows||empty}</div>`;
}
function dismissTour(){STATE.tourDone=true;renderCockpit();}

/* ======================= ACCOUNT ======================= */
function setTab(t){STATE.tab=t;renderAccount();}
function renderAccount(){
  const a=ACCOUNTS.find(x=>x.id===STATE.account);
  const prod=a.product==='BOLD'?`<span class="prod-chip prod-bold">BOLD</span>`:`<span class="prod-chip prod-refill">REFILL+</span>`;
  const escBanner=a.escalated?`<div class="esc-banner"><div class="eb-ic">${svg('flame',20)}</div><div><div class="eb-t">Re-surfaced — the logged play didn't land</div><div class="eb-s">Actioned 8 days ago, but usage kept falling — so AURA re-opened it.</div></div></div>`:'';

  const bindTxt=a.renewal.noticeDays!=null?`notice in ${a.renewal.noticeDays}d · renews ${a.renewal.date}`:(a.renewal.days<900?'renews in '+a.renewal.days+'d':'month-to-month');
  const bindRed=a.renewal.noticeDays!=null&&a.renewal.noticeDays<=90;
  const head=`<div class="acct-head">
    <div><div style="display:flex;align-items:center;gap:12px">
      <div class="ring" style="width:46px;height:46px">${ringSVG(a.pulse,46)}<span class="rv" style="font-size:14px">${a.pulse}</span></div>
      <div><h1>${a.name}</h1><div class="h-meta"><span>${prod}</span>${a.locations>1?`<span>${svg('building',14)} ${a.locations} locations</span>`:`<span>${svg('pin',14)} ${a.loc}</span>`}<span style="${bindRed?'color:var(--red);font-weight:700':''}">${svg('clock',14)} ${bindTxt}</span></div></div>
    </div></div>
    <div class="acct-stats">
      <div class="stat-pill"><div class="sv">${eur(a.runrate)}</div><div class="sl">ARR / year · usage-linked</div><div class="arr-sub">≈ ${eur(a.monthly)}/mo</div></div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <button class="logtouch" onclick="openLogTouch('${a.id}')">${svg('mail',13)} Log a touch</button>
        <div class="reassign" onclick="openReassign('${a.id}')">${svg('swap')} <span>Owner: <b style="color:var(--navy)">${a.owner}</b></span></div>
      </div>
    </div></div>`;

  const tabs=`<div class="tabs">
    <button class="tab ${STATE.tab==='overview'?'on':''}" onclick="setTab('overview')">${svg('pulse',15)} Overview</button>
    <button class="tab ${STATE.tab==='stakeholders'?'on':''}" onclick="setTab('stakeholders')">${svg('users',15)} Stakeholders <span class="tcount">${a.contacts.length}</span></button>
    <button class="tab ${STATE.tab==='insights'?'on':''}" onclick="setTab('insights')">${svg('leaf',15)} Insights</button>
    <button class="tab ${STATE.tab==='activity'?'on':''}" onclick="setTab('activity')">${svg('clock',15)} Activity <span class="tcount">${a.activity.length}</span></button>
  </div>`;

  let body='';
  if(STATE.tab==='overview')body=tabOverview(a);
  else if(STATE.tab==='stakeholders')body=tabStakeholders(a);
  else if(STATE.tab==='insights')body=tabInsights(a);
  else body=tabActivity(a);

  document.getElementById('content').innerHTML=escBanner+head+tabs+body;
}

function tabOverview(a){
  // pulse panel
  const sent=deriveSentiment(a);
  const sigMeta=[['usage','Usage','vs last year',a.signals.usage],['adoption','Adoption','drinks per head',a.signals.adoption],['service','Service','errors · sanitation',a.signals.service],['consumable','Consumables','flavor · CO₂ · filter',a.signals.consumable],['sentiment','Sentiment',sent.why,sent.score]];
  const sigBars=sigMeta.map(([k,n,s,v])=>{const col=v>=70?CLR.healthy:v>=50?CLR.service:CLR.protect;const w=Math.round(WEIGHTS[k]*100);return `<div class="sig"><div class="sig-name">${n} <span class="sig-w">×${w}%</span><small>${s}</small></div><div class="bar"><i style="width:${v}%;background:${col}"></i></div><div class="sig-score" style="color:${col}">${v}</div></div>`;}).join('');
  const composite=`<div class="composite">Weighted composite → <b>${a.pulse}</b> <span>= ${sigMeta.map(([k,n,,v])=>`${Math.round(WEIGHTS[k]*100)}%·${v}`).join(' + ')}</span></div>`;
  const deltaCls=a.delta<0?'dn':'up';const deltaTxt=(a.delta>0?'+':'')+a.delta+' pts';
  // driver: what's dragging an at-risk account down, or leading a healthy one
  const drag=sigMeta.slice().sort((x,y)=>(WEIGHTS[y[0]]*(100-y[3]))-(WEIGHTS[x[0]]*(100-x[3])))[0];
  const lead=sigMeta.slice().sort((x,y)=>y[3]-x[3])[0];
  const healthy=a.pulse>=70;const driver=healthy?lead:drag;const driverWord=healthy?'Led by':'Dragged down by';
  const dcol=driver[3]>=70?CLR.healthy:driver[3]>=50?CLR.service:CLR.protect;
  const exp=STATE.pulseExpanded;
  const pulsePanel=`<div class="panel"><div class="panel-head"><h3>Pulse score</h3><span class="ph-tag">weighted · 5 signals</span></div>
    <div class="big-pulse"><div class="big-ring" style="width:88px;height:88px">${ringSVG(a.pulse,88)}<span class="bv"><b>${a.pulse}</b><small>${(a.escalated?'ESCALATED':a.cls.toUpperCase())}</small></span></div>
    <div class="bp-txt"><div class="t">${a.signalText}</div><span class="delta ${deltaCls}">${svg(a.delta<0?'trendDown':'trendUp',12)} ${deltaTxt} this period</span>
      <div class="driver">${driverWord} <b>${driver[1].toLowerCase()}</b> <span class="driver-score" style="color:${dcol}">${driver[3]}</span></div></div></div>
    <div class="whatchg"><b>What changed:</b> ${a.whatChanged}</div>
    <button class="peek" onclick="STATE.pulseExpanded=${!exp};renderAccount()">${svg(exp?'chevL':'chevR',13)} ${exp?'Hide':'View'} 8-week history & all 5 signals</button>
    ${exp?`<div style="margin-top:14px">${sparkFromHist(a.pulseHist,a.delta<0?CLR.protect:CLR.healthy)}<div style="font-size:11px;color:var(--muted);font-weight:600;margin-bottom:12px">8-week score history</div><div class="sig-list">${sigBars}</div>${composite}</div>`:''}
    </div>`;
  // usage panel (normalized)
  const trendCls=a.vsSeasonal<0?'down':(a.vsSeasonal>0?'up':'');
  const drinksMo=a.drinksMonth;
  const perEmpNow=a.employees?(drinksMo/(a.employees*30)):null;
  const perEmpTxt=perEmpNow!=null?`${perEmpNow.toFixed(1)} drinks/emp/day${a.perEmpWas!=null?` (was ${a.perEmpWas.toFixed(1)})`:''}`:'public site · pay-per-use';
  const usagePanel=`<div class="panel"><div class="panel-head"><h3>Usage & revenue</h3><span class="ph-tag">pay-per-drink</span></div>
    <div class="usage-metrics"><div class="um"><div class="uv ${trendCls}">${a.vsSeasonal>0?'+':''}${a.vsSeasonal}%</div><div class="ul">vs last year <span class="ttip" title="Compared to the same period last year — normalised for seasonality and headcount, so a summer dip or a smaller office doesn't trigger a false alarm.">ⓘ</span></div></div><div class="um"><div class="uv">${(drinksMo/1000).toFixed(1)}k</div><div class="ul">drinks / month</div></div>${perEmpNow!=null?`<div class="um"><div class="uv">${perEmpNow.toFixed(1)}</div><div class="ul">drinks / emp / day</div></div>`:''}</div>
    ${usageSpark(a.sparkTrend)}
    ${perEmpNow!=null?`<div class="norm-note">${perEmpTxt}</div>`:''}</div>`;
  // contract panel
  const r=a.renewal;
  const contractPanel=`<div class="panel"><div class="panel-head"><h3>Contract & renewal</h3><span class="ph-tag">${r.type} renewal</span></div>
    <div class="kv">
      <div class="kv-row"><span class="k">Renewal date</span><span class="v">${r.date}${r.days<900?' · in '+r.days+'d':''}</span></div>
      <div class="kv-row"><span class="k">Term</span><span class="v">${r.term}</span></div>
      <div class="kv-row"><span class="k">Type</span><span class="v ${r.type==='auto'?'':'warn'}">${r.type==='auto'?'Auto-renew':'Manual — needs active renewal'}</span></div>
      <div class="kv-row"><span class="k">Notice deadline</span><span class="v ${/Sep/.test(r.notice)?'risk':''}">${r.notice}</span></div>
      <div class="kv-row"><span class="k">Renewal owner</span><span class="v">${r.owner}</span></div>
    </div>
    <div style="margin-top:14px"><div class="dr-lbl">Revenue model</div>
    <div class="model-note">100% <b>usage-linked</b> · ${(a.drinksMonth/1000).toFixed(1)}k drinks/mo × €${a.rate.toFixed(2)} = ${eur(a.monthly)}/mo (${eur(a.runrate)}/yr). No fixed floor — the whole amount tracks dispense volume, so a usage drop erodes revenue in real time.</div></div>
    ${r.stage?renewalObject(a):''}
    </div>`;

  // action panel: escalated/play sequence / monitoring / followup / dismissed / healthy
  let action;
  if(a.dismissed){
    action=`<div class="panel"><div class="dismissed-note">${svg('ban',20)}<div><div class="dn-t">Dismissed — ${a.dismissed.reason}</div><div class="dn-s">Removed from your queue. AURA still monitors the signal in the background.</div></div><button class="dn-undo" onclick="undismiss('${a.id}')">Undo</button></div></div>`;
  } else if(a.opp){
    const stages=['Proposed','In review','Verbal','Closed'];const si=stages.indexOf(a.opp.stage);
    action=`<div class="panel"><div class="opp-card"><span class="rec-tag" style="background:var(--cyan-bg);color:var(--cyan-600)">${svg('trendUp',13)} Expansion opportunity</span><h3 style="font-size:15.5px;margin:8px 0">${a.opp.type} · +${eur(a.opp.arr)}/yr</h3>
      <div class="opp-stages">${stages.map((s,i)=>`<div class="opp-stage ${i===si?'on':i<si?'past':''}">${s}</div>`).join('')}</div>
      <div class="kv-row"><span class="k">Owner</span><span class="v">${a.opp.owner}</span></div><div class="kv-row" style="margin-top:6px"><span class="k">Expected close</span><span class="v">${a.opp.close}</span></div>
      <div class="rec-foot"><div class="rec-amt up">+${eur(a.opp.arr)}<small>added to pipeline</small></div><button class="rec-start" style="background:var(--cyan-600)" onclick="advanceOpp('${a.id}')">${svg('trendUp',15)} Advance stage</button></div></div></div>`;
  } else if(a.monitored&&!a.escalated&&a.followup&&a.followup.due&&!a.followup.done){
    const isS=a.cls==='service';const read=isS?{ok:true,text:`Signal recovering — service back to ${a.signals.service}, error A.01 cleared`}:{ok:false,text:`Signal hasn't recovered — usage still ${a.vsSeasonal}%, no reply logged`};
    action=`<div class="panel"><div class="panel-head"><h3>Follow-up due today</h3><span class="ph-tag">${a.contacts[0].name}</span></div>
      <div class="fu-read ${read.ok?'ok':'bad'}">${svg(read.ok?'check':'alert',16)}<span>${read.text}</span></div>
      <div class="fu-q">${isS?'Did the service action resolve the issue?':'Did the account respond and start recovering?'}</div>
      <div class="fu-actions"><button class="fu-btn resolved" onclick="completeFollowup('${a.id}','resolved')">${svg('check',15)} Confirm resolved</button><button class="fu-btn escalate" onclick="completeFollowup('${a.id}','escalate')">${svg('flame',15)} Still an issue — escalate</button><button class="fu-btn snooze" onclick="completeFollowup('${a.id}','snooze')">${svg('clock',15)} Snooze 1 week</button></div></div>`;
  } else if(a.seqActive&&!a.escalated){
    const p=a.play;const doneN=p.steps.filter(s=>s[2]).length,total=p.steps.length,nextIdx=p.steps.findIndex(s=>!s[2]),complete=nextIdx<0;
    const seq=`<div class="seq">${p.steps.map((s,i)=>`<div class="seq-step ${s[2]?'donestep':''}"><span class="seq-dot ${s[2]?'done':(i===nextIdx?'cur':'')}">${s[2]?'✓':i+1}</span><span class="st">${s[0]}</span>${s[3]?`<span class="seq-to">to ${s[3]}</span>`:''}<span class="stc">${s[2]?'logged':(i===nextIdx?('due '+(a.seqDue||'soon')):'pending')}</span></div>`).join('')}</div>`;
    action=`<div class="panel"><div class="panel-head"><h3>${complete?'Sequence complete':'Sequence in progress'}</h3><span class="ph-tag">${doneN}/${total} steps · ${p.type} play</span></div>
      ${seq}
      <div class="monitor-note" style="margin-top:14px"><div class="mn-ic">${svg('shield',18)}</div><div><div class="mn-t">${complete?'All steps logged — monitored':'Sequence running — monitored'}</div><div class="mn-s">AURA re-opens this automatically if the signal keeps falling.</div></div></div>
      ${complete?'':`<div class="rec-foot"><div></div><button class="rec-start" style="background:var(--navy)" onclick="advanceSeq('${a.id}')">${svg('check',15)} Log step ${doneN+1} · ${p.steps[nextIdx][0]}</button></div>`}</div>`;
  } else if(a.monitored&&!a.escalated){
    const due=(a.followup&&a.followup.dueLabel)?a.followup.dueLabel:'scheduled';
    action=`<div class="panel"><div class="panel-head"><h3>Monitoring</h3><span class="ph-tag">follow-up ${due}</span></div><div class="monitor-note"><div class="mn-ic">${svg('shield',18)}</div><div><div class="mn-t">Monitored</div><div class="mn-s">AURA re-opens this automatically if usage keeps falling.</div></div></div></div>`;
  } else if(a.play){
    const p=a.play;const amtCls=p.type==='grow'?'up':'risk';
    const seq=`<div class="seq">${p.steps.map((s,i)=>`<div class="seq-step ${s[2]?'donestep':''}"><span class="seq-dot ${s[2]?'done':(i===p.steps.findIndex(x=>!x[2])?'cur':'')}">${s[2]?'✓':i+1}</span><span class="st">${s[0]}</span>${s[3]?`<span class="seq-to">to ${s[3]}</span>`:''}<span class="stc">${s[1]}</span></div>`).join('')}</div>`;
    action=`<div class="panel" style="padding:0"><div class="rec rec-${p.type}"><span class="rec-tag">${svg(p.type==='grow'?'trendUp':'shield',13)} Recommended ${p.type} sequence</span><h3>${p.title}</h3><div class="rec-body">${p.body}</div>
      <div class="dr-lbl" style="margin-top:14px">Play sequence — ${p.steps.length} steps</div>${seq}
      <div class="rec-foot"><div class="rec-amt ${amtCls}">${eur(a.arr)}<small>${p.amtLabel}</small></div>
      <div class="rec-actions"><button class="rec-sec" onclick="openSnooze('${a.id}')">${svg('moon',14)} Snooze</button><button class="rec-sec" onclick="openDismiss('${a.id}')">${svg('ban',14)} Not a risk</button><button class="rec-start" onclick="openDrawer('${a.id}')">${svg(p.type==='grow'?'trendUp':'send',15)} Start sequence</button></div></div></div></div>`;
  } else {
    action=`<div class="panel"><div class="empty-note">${svg('check',32)}<div class="en-t">Healthy account</div>All signals nominal. Keep the relationship warm — next QBR is scheduled.</div></div>`;
  }

  return `<div class="grid-2">${pulsePanel}${usagePanel}</div><div class="grid-2">${contractPanel}${action}</div>`;
}

function tabStakeholders(a){
  const champ=a.contacts.find(c=>c.role==='Champion');
  const risk=champ&&champ.vacant;
  const banner=risk?`<div class="esc-banner" style="background:linear-gradient(90deg,#7a1a10,#b03a1a)"><div class="eb-ic">${svg('alert',20)}</div><div><div class="eb-t">Champion-risk — no active sponsor</div><div class="eb-s">Your champion has left and no replacement is engaged. Derived automatically from the stakeholder map — the top driver of this account's risk score.</div></div></div>`:'';
  const cards=a.contacts.map(c=>{
    const slabel={pos:'Positive',neu:'Neutral',neg:'Detractor',gone:'Left'}[c.sentiment];
    return `<div class="stk"><div class="stk-top"><div class="stk-av ${c.vacant?'vacant':''}">${c.vacant?svg('users',18):initials(c.name)}</div><div><div class="stk-nm">${c.vacant?'Vacant':c.name}</div><div class="stk-role"><span class="role-tag">${c.role}</span></div></div></div><div class="stk-meta"><span>Last contact: ${c.last}</span><span class="senti ${c.sentiment}">${svg(c.sentiment==='pos'?'smile':c.sentiment==='neg'||c.sentiment==='gone'?'alert':'smile',12)} ${slabel}</span></div></div>`;
  }).join('');
  const locs=a.locations>1?`<div class="panel" style="margin-top:16px"><div class="panel-head"><h3>Locations & systems</h3><span class="ph-tag">${a.locations} locations · ${a.systems} systems</span></div><div class="loc-list">${a.locList.map(([n,sys,tr])=>`<div class="loc-row"><span class="ln">${n} <span class="lm">· ${sys} system${sys>1?'s':''}</span></span><span style="font-weight:700;color:${tr.startsWith('-')||tr.startsWith('−')?'var(--red)':'var(--green)'}">${tr}</span></div>`).join('')}</div></div>`:'';
  return `${banner}<div class="stk-grid">${cards}</div>${locs}`;
}
function tabInsights(a){
  const flav=a.flavors.map(([n,p,c])=>`<div class="flav"><span class="fn">${n}</span><span class="fbar"><i style="width:${p*2}%;background:${c}"></i></span><span class="fp">${p}%</span></div>`).join('');
  return `<div class="grid-2">
    <div class="panel"><div class="panel-head"><h3>Sustainability impact</h3><span class="ph-tag">for the QBR</span></div><div class="esg">${a.esg.map(([v,l])=>`<div class="esg-c"><div class="ev">${v}</div><div class="el">${l}</div></div>`).join('')}</div><div style="font-size:12px;color:var(--muted);margin-top:8px">Package these numbers into the client's ESG report — the value story that supports renewal and expansion.</div></div>
    <div class="panel"><div class="panel-head"><h3>Flavour mix</h3><span class="ph-tag">last 30 days</span></div><div class="flavors">${flav}</div><div style="font-size:12px;color:var(--muted);margin-top:12px">Mix informs stocking and the QBR conversation — not a retention signal on its own.</div></div>
  </div>`;
}
function tabActivity(a){
  const cmap={protect:['var(--red-bg)','var(--red)'],service:['var(--amber-bg)','var(--amber)'],grow:['var(--cyan-bg)','var(--cyan-600)'],healthy:['var(--green-bg)','var(--green)'],navy:['#eef0f6','var(--navy)']};
  return `<div class="panel"><div class="panel-head"><h3>Activity</h3><span class="ph-tag">${a.contacts[0].name} · ${a.contacts[0].role}</span></div><div class="timeline">${a.activity.map(e=>{const[bg,fg]=cmap[e.c]||cmap.navy;return `<div class="tl"><div class="tl-ic" style="background:${bg};color:${fg}">${svg(e.ic,15)}</div><div class="tl-body"><div class="t">${e.t}</div><div class="m">${e.m}</div></div></div>`;}).join('')}</div></div>`;
}

/* ======================= DRAWERS ======================= */
function openDrawer(id){
  const a=ACCOUNTS.find(x=>x.id===STATE.account)||ACCOUNTS.find(x=>x.id===id);
  const p=a.play;const dr=document.getElementById('drawer');
  const tagBg={protect:'var(--red-bg)',service:'var(--amber-bg)',grow:'var(--cyan-bg)'}[p.type];const tagFg={protect:'var(--red)',service:'var(--amber)',grow:'var(--cyan-600)'}[p.type];
  const channels=[['email','mail','Email'],['phone','phone','Call'],['meeting','meeting','Meeting'],['link','link','LinkedIn']];
  const chanRow=channels.map(([k,ic,l])=>`<button class="chan ${p.channel===k?'active':''}" onclick="pickChan(this)">${svg(ic,15)} ${l}</button>`).join('');
  const seq=`<div class="seq">${p.steps.map((s,i)=>`<div class="seq-step"><span class="seq-dot ${i===0?'cur':''}">${i+1}</span><span class="st">${s[0]}</span>${s[3]?`<span class="seq-to">to ${s[3]}</span>`:''}<span class="stc">${s[1]}</span></div>`).join('')}</div>`;
  const extra=p.type==='grow'
    ?`<div class="dr-field"><div class="dr-lbl">Expansion opportunity</div><div class="dr-two"><input class="dr-input" value="${a.product==='BOLD'?'+1 BOLD unit + boost plan':'+2 units · re-band'}"/><input class="dr-input" value="${eur(a.arr)} / yr"/></div></div>`
    :`<div class="dr-field"><div class="dr-lbl">Schedule next step</div><div class="dr-two"><input class="dr-input" type="date"/><input class="dr-input" value="${ME.name} (me)"/></div></div>`;
  const submitLbl=p.type==='grow'?`Log step & create opportunity`:`Log step 1 & schedule step 2`;
  dr.innerHTML=`<div class="dr-head"><div><span class="dtag" style="background:${tagBg};color:${tagFg}">${p.type} sequence</span><h2>${p.title}</h2></div><button class="dr-close" onclick="closeDrawer()">${svg('x',16)}</button></div>
    <div class="dr-body">
      <div class="dr-ctx"><div class="dc-row"><span class="l">Account</span><span class="v">${a.name} · ${a.loc}</span></div><div class="dc-row"><span class="l">Contact</span><span class="v">${a.contacts[0].name}</span></div><div class="dc-row"><span class="l">${p.type==='grow'?'ARR upside':'ARR at risk'}</span><span class="v" style="color:${p.type==='grow'?'var(--cyan-600)':'var(--red)'}">${eur(a.arr)}</span></div></div>
      <div class="dr-field"><div class="dr-lbl">Sequence (${p.steps.length} steps — logging step 1 now)</div>${seq}</div>
      <div class="dr-field"><div class="dr-lbl">Channel · step 1</div><div class="chan-row">${chanRow}</div></div>
      <div class="dr-field"><div class="dr-lbl">Message · drafted from AURA data</div><textarea class="dr-msg">${p.draft}</textarea></div>
      ${extra}
      <div class="writeback">${svg('check',15)} Sends from jordy@aquablu.com · auto-logs to Salesforce · reply-tracking on</div>
    </div>
    <div class="dr-foot"><button class="dr-cancel" onclick="closeDrawer()">Cancel</button><button class="dr-submit s-${p.type}" onclick="submitPlay('${a.id}')">${svg('check',16)} ${submitLbl}</button></div>`;
  document.getElementById('overlay').classList.add('active');dr.classList.add('active');
}
function pickChan(el){el.parentElement.querySelectorAll('.chan').forEach(c=>c.classList.remove('active'));el.classList.add('active');}
function closeDrawer(){document.getElementById('overlay').classList.remove('active');document.getElementById('drawer').classList.remove('active');}

function openReason(id,mode){
  const a=ACCOUNTS.find(x=>x.id===id);const dr=document.getElementById('drawer');
  const snoozeOpts=[['1 week',7],['2 weeks',14],['30 days',30],['Next quarter',90]];
  const dismissOpts=['Seasonal — known low period','Site relocating / temporary','Customer confirmed healthy','Handled outside AURA','Duplicate / not a real risk'];
  const inner=mode==='snooze'
    ?`<div class="dr-lbl">Snooze — why & how long</div><div class="reasons">${snoozeOpts.map(([l,n])=>`<button class="reason" onclick="doSnooze('${id}',${n},'${l}')">${svg('moon')} ${l}</button>`).join('')}</div>`
    :`<div class="dr-lbl">Not a risk — reason (feeds the model)</div><div class="reasons">${dismissOpts.map(r=>`<button class="reason" onclick="doDismiss('${id}','${r}')">${svg('ban')} ${r}</button>`).join('')}</div>`;
  dr.innerHTML=`<div class="dr-head"><div><span class="dtag" style="background:var(--bg);color:var(--muted)">${mode==='snooze'?'Snooze':'Dismiss'}</span><h2>${a.name}</h2></div><button class="dr-close" onclick="closeDrawer()">${svg('x',16)}</button></div><div class="dr-body">${inner}<div style="font-size:12px;color:var(--muted);margin-top:16px">${mode==='snooze'?'Removes it from today\'s queue and re-checks the signal when it\'s due.':'Suppresses the alert and records the reason. AURA keeps monitoring in the background and re-opens only if the signal materially worsens.'}</div></div>`;
  document.getElementById('overlay').classList.add('active');dr.classList.add('active');
}
function openSnooze(id){openReason(id,'snooze');}
function openDismiss(id){openReason(id,'dismiss');}
function doSnooze(id,n,label){const a=ACCOUNTS.find(x=>x.id===id);a.monitored=true;a.followup={dueLabel:niceDate(n),due:false,done:false};if(a.escalated){a.escalated=false;a.done=true;}a.activity.unshift({ic:'moon',c:'navy',t:'Snoozed '+label+' · by '+ME.name,m:'AURA · just now'});closeDrawer();toast('Snoozed',`${a.name} snoozed ${label.toLowerCase()} — back when it's due.`);back();}
function doDismiss(id,reason){const a=ACCOUNTS.find(x=>x.id===id);a.dismissed={reason};a.activity.unshift({ic:'ban',c:'navy',t:'Dismissed — '+reason+' · by '+ME.name,m:'AURA · just now'});closeDrawer();toast('Dismissed',`${a.name}: "${reason}" recorded — feeds the model.`);back();}
function undismiss(id){const a=ACCOUNTS.find(x=>x.id===id);a.dismissed=null;toast('Restored',`${a.name} back in your queue.`);renderTopbar();renderAccount();}
function openReassign(id){
  const a=ACCOUNTS.find(x=>x.id===id);const dr=document.getElementById('drawer');const owners=['Jordy','Natalia','Fauve (Head of CS)'];
  dr.innerHTML=`<div class="dr-head"><div><span class="dtag" style="background:var(--violet-bg);color:var(--violet)">Reassign</span><h2>${a.name}</h2></div><button class="dr-close" onclick="closeDrawer()">${svg('x',16)}</button></div><div class="dr-body"><div class="dr-lbl">Assign account owner</div><div class="reasons">${owners.map(o=>`<button class="reason" onclick="doReassign('${id}','${o.split(' ')[0]}')">${svg('users')} ${o}${a.owner===o.split(' ')[0]?' · current':''}</button>`).join('')}</div><div style="font-size:12px;color:var(--muted);margin-top:16px">Coverage: reassigning moves the account and its open tasks to the new owner's book.</div></div>`;
  document.getElementById('overlay').classList.add('active');dr.classList.add('active');
}
function doReassign(id,owner){const a=ACCOUNTS.find(x=>x.id===id);a.owner=owner;a.activity.unshift({ic:'swap',c:'navy',t:'Reassigned to '+owner,m:'AURA · just now'});closeDrawer();toast('Reassigned',`${a.name} now owned by ${owner}.`);renderTopbar();renderAccount();}
function bulkSnooze(){STATE.selected.forEach(id=>{const a=ACCOUNTS.find(x=>x.id===id);a.monitored=true;a.followup={dueLabel:niceDate(7),due:false,done:false};if(a.escalated){a.escalated=false;a.done=true;}});toast('Snoozed',`${STATE.selected.length} accounts snoozed 1 week.`);STATE.selected=[];render();}
function bulkReassign(){STATE.selected.forEach(id=>{ACCOUNTS.find(x=>x.id===id).owner='Natalia';});toast('Reassigned',`${STATE.selected.length} accounts reassigned to Natalia.`);STATE.selected=[];render();}

function back(){renderTopbar();if(STATE.view==='account')renderAccount();else renderCockpit();}

/* ======================= ACTIONS ======================= */
function submitPlay(id){
  const a=ACCOUNTS.find(x=>x.id===id);a.done=true;const wasEsc=a.escalated;
  if(a.cls==='grow'){
    a.opp={type:a.product==='BOLD'?'+1 BOLD unit + boost plan':'+2 units · re-band',arr:a.arr,stage:'Proposed',owner:ME.name,close:niceDate(30)};
    a.activity.unshift({ic:'trendUp',c:'grow',t:`Expansion opportunity created — +${eur(a.arr)} ARR (Proposed)`,m:'AURA · just now · by '+ME.name});
    a.activity.unshift({ic:a.play.steps[0][1]==='phone'?'phone':'mail',c:'navy',t:'Sequence step 1 logged · synced to Salesforce',m:'AURA · just now · by '+ME.name});
    toast('Opportunity created',`+${eur(a.arr)} ARR in pipeline (Proposed) — synced to Salesforce.`);
  }else{
    a.monitored=true;a.escalated=false;a.seqActive=true;
    if(a.play&&a.play.steps&&a.play.steps[0])a.play.steps[0][2]=true;   // step 1 logged
    a.seqDue=niceDate(5);
    a.followup={dueLabel:niceDate(7),owner:ME.name,due:false,done:false};
    a.activity.unshift({ic:'mail',c:'navy',t:'Sequence step 1 logged · sent & synced to Salesforce',m:'AURA · just now · by '+ME.name});
    toast(wasEsc?'Escalation actioned':'Step 1 sent',`${a.name} → sequence running · step 2 due ${niceDate(5)} · reply-tracking on.`);
  }
  closeDrawer();renderTopbar();renderAccount();
}
function advanceSeq(id){
  const a=ACCOUNTS.find(x=>x.id===id);const p=a.play;if(!p)return;
  const i=p.steps.findIndex(s=>!s[2]);if(i<0)return;
  p.steps[i][2]=true;
  const nx=p.steps.findIndex(s=>!s[2]);a.seqDue=nx>=0?niceDate(5):null;
  a.activity.unshift({ic:'check',c:'navy',t:'Sequence step '+(i+1)+' logged — '+p.steps[i][0],m:'AURA · just now · by '+ME.name});
  toast(nx>=0?('Step '+(i+1)+' logged'):'Sequence complete',nx>=0?(`${a.name} · step ${nx+1} due ${a.seqDue}`):(`${a.name} — all steps done, under watch`));
  rerender();
}
function advanceOpp(id){const a=ACCOUNTS.find(x=>x.id===id);const st=['Proposed','In review','Verbal','Closed'];let i=st.indexOf(a.opp.stage);if(i<st.length-1)i++;a.opp.stage=st[i];a.activity.unshift({ic:'trendUp',c:'grow',t:'Opportunity moved to '+st[i],m:'AURA · just now · by '+ME.name});toast('Stage advanced',`${a.name} expansion → ${st[i]}.`);renderAccount();}
function completeFollowup(id,outcome){
  const a=ACCOUNTS.find(x=>x.id===id);a.followup=a.followup||{};const wasService=a.cls==='service';
  if(outcome==='resolved'){
    a.followup.done=true;a.followup.due=false;a.monitored=false;a.escalated=false;a.seqActive=false;a.cls='healthy';
    if(!wasService){a.signals.usage=Math.min(90,a.signals.usage+26);a.signals.adoption=Math.min(90,a.signals.adoption+18);a.vsSeasonal=Math.abs(a.vsSeasonal);}else{a.signals.service=Math.max(a.signals.service,86);}
    a.pulse=computePulse(a.signals);a.pulseHist=a.pulseHist.slice(1).concat(a.pulse);a.delta=a.pulseHist[a.pulseHist.length-1]-a.pulseHist[0];
    a.signalText=wasService?'Service confirmed · all systems healthy':'Recovered after your outreach';a.signalSub='Follow-up closed';a.play=null;
    a.activity.unshift({ic:'check',c:'healthy',t:'Follow-up completed — resolved & closed',m:'AURA · just now · by '+ME.name});
    toast('Follow-up closed',`${a.name} confirmed healthy.`);
  }else if(outcome==='escalate'){
    a.followup.done=true;a.followup.due=false;a.escalated=true;a.done=false;a.monitored=true;a.seqActive=false;a.pulse=Math.max(28,a.pulse-12);
    a.signalText=wasService?'Escalated · service issue unresolved':'Escalated · no recovery after follow-up';a.signalSub='Re-surfaced — needs a stronger play';
    a.play={type:'protect',title:wasService?'Re-dispatch & escalate to Head of Service':'Escalate to Head of CS & book a save call',
      body:'The follow-up came back <b>unresolved</b>. Escalate for senior attention and a stronger motion before it costs the renewal.',channel:'meeting',amtLabel:'ARR exposed',
      steps:[['Escalate internally','meeting',false],['Priority re-dispatch / save call','meeting',false]],
      draft:`Hi — escalating ${a.name}; the follow-up went unresolved. Looping in senior support to get this fixed fast.\n\nJordy`};
    a.activity.unshift({ic:'flame',c:'protect',t:'Follow-up completed — unresolved, escalated',m:'AURA · just now · by '+ME.name});
    toast('Escalated',`${a.name} re-opened for a stronger play.`);
  }else{a.followup.dueLabel=niceDate(7);a.followup.due=false;a.activity.unshift({ic:'clock',c:'navy',t:'Follow-up snoozed to '+niceDate(7),m:'AURA · just now · by '+ME.name});toast('Snoozed',`${a.name} follow-up → ${niceDate(7)}.`);}
  rerender();
}

/* toast */
let tt2;function toast(title,sub){const t=document.getElementById('toast');t.innerHTML=`<div class="tk">${svg('check',17)}</div><div><div class="tt">${title}</div><div class="ts">${sub}</div></div>`;t.classList.add('active');clearTimeout(tt2);tt2=setTimeout(()=>t.classList.remove('active'),3600);}

/* keyboard: / focuses search */
document.addEventListener('keydown',e=>{if(e.key==='/'&&STATE.view==='cockpit'){const i=document.querySelector('.search input');if(i&&document.activeElement!==i){e.preventDefault();i.focus();}}if(e.key==='Escape')closeDrawer();});

function render(){renderTopbar();if(STATE.view==='cockpit')renderCockpit();else renderAccount();}
function signIn(){document.getElementById('login').classList.add('hide');document.getElementById('app').classList.remove('hide');STATE.view='cockpit';render();}
</script>
</body>
</html>
